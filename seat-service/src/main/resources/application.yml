spring:
  application:
    name: seat-service

  datasource:
    url: ${SEAT_DB_URL:jdbc:postgresql://localhost:5432/seat}
    username: ${SEAT_DB_USER:holdtheseat}
    password: ${SEAT_DB_PASSWORD:holdtheseat}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8082}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
