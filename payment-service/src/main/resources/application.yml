spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${PAYMENT_DB_USER:holdtheseat}
    password: ${PAYMENT_DB_PASSWORD:holdtheseat}

  flyway:
    enabled: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Strings both ways. spring-kafka's JsonDeserializer builds its own Jackson 2 mapper
      # rather than the Spring-managed Jackson 3 one, so binding there means a second Jackson
      # with a second configuration — and java.time fails in it. Listeners deserialize with
      # the application mapper instead, the same one the outbox serialised with.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8083}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

holdtheseat:
  gateway:
    decline-customer-id: ${GATEWAY_DECLINE_CUSTOMER_ID:decline-me}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
